# Server Configuration
server.port=8083

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=inshorts
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.collection=news_data

# Redis Configuration for Caching
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# LLM Configuration
llm.huggingface.url=https://api-inference.huggingface.co/models/gpt2
llm.huggingface.token=${HUGGINGFACE_TOKEN:}
#llm.huggingface.token=123

# Logging Configuration
logging.level.com.example.inshorts=DEBUG
logging.level.org.springframework.cache=DEBUG
