# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=newsdb
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.collection=news_data

# JPA Configuration (for MongoDB, we'll use MongoDB repositories instead)
# spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Logging
logging.level.com.example.inshorts=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# LLM Service Configuration
llm.service.type=real
llm.huggingface.url=https://api-inference.huggingface.co/models/microsoft/DialoGPT-medium
